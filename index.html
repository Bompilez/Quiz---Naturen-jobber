<!DOCTYPE html>
<html lang="nb">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
    <title>Naturen jobber – quiz</title>
</head>
<body>
    <main class="quiz">
        <header class="quiz-header">
            <p class="quiz-name">Naturen jobber</p>
            <div id="quiz-progress" class="quiz-progress" role="progressbar" aria-label="Quizfremdrift"></div>
        </header>

        <section id="question-screen" aria-labelledby="question" hidden>
            <h1 id="question" tabindex="-1"></h1>

            <div class="quiz-card">
                <img id="illustration" alt="" width="572" height="416">
                <div id="feedback" class="quiz-feedback" role="group" aria-labelledby="feedback-title" aria-describedby="feedback-explanation" tabindex="-1" hidden>
                    <h2 id="feedback-title"></h2>
                    <p id="feedback-explanation"></p>
                </div>
            </div>

            <form id="quiz-form">
                <fieldset id="answers" class="quiz-answers" aria-label="Svaralternativer">
                    <label class="quiz-option">
                        <span class="quiz-letter">A</span>
                        <span class="quiz-answer-text"></span>
                        <input type="radio" name="answer" value="a" required>
                    </label>
                    <label class="quiz-option">
                        <span class="quiz-letter">B</span>
                        <span class="quiz-answer-text"></span>
                        <input type="radio" name="answer" value="b">
                    </label>
                    <label class="quiz-option">
                        <span class="quiz-letter">C</span>
                        <span class="quiz-answer-text"></span>
                        <input type="radio" name="answer" value="c">
                    </label>
                </fieldset>

                <button id="submit-answer" type="submit">Svar</button>
                <button id="next-question" type="button" hidden>Neste spørsmål</button>
            </form>
        </section>

        <section id="result-screen" class="quiz-result" aria-labelledby="result-title" hidden>
            <h1 id="result-title" tabindex="-1"></h1>
            <p id="result-message"></p>
            <button id="try-again" type="button">Prøv igjen</button>
        </section>
    </main>
</body>
</html>
